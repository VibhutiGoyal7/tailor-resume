    <path d="M350 268 L358 274 L350 280" fill="none" stroke="#A9B2B6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <line x1="32" y1="298" x2="358" y2="298" stroke="#E4E9EB"/>
    <text x="32" y="332" font-size="15" fill="#1D2226">Notifications</text>
    <path d="M350 326 L358 332 L350 338" fill="none" stroke="#A9B2B6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

