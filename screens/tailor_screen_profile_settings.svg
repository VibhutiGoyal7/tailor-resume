  <text x="98" y="122" font-size="16" font-weight="500" fill="#1D2226">Nikhil Verma</text>
  <text x="98" y="142" font-size="13" fill="#7B8681">nikhil@email.com</text>

  <!-- settings rows -->
  <g>
    <line x1="32" y1="182" x2="358" y2="182" stroke="#E4E9EB"/>
