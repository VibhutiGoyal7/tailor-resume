<svg viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg">
  <rect width="390" height="844" fill="#F1F3F4"/>

  <!-- ambient organic shapes -->
  <ellipse cx="40" cy="120" rx="90" ry="70" fill="#EAEFF0" transform="rotate(-12 40 120)"/>
  <ellipse cx="350" cy="80" rx="60" ry="60" fill="#E4EAEC" transform="rotate(8 350 80)"/>
  <circle cx="330" cy="260" r="7" fill="#D6E1E4"/>
  <circle cx="30" cy="320" r="5" fill="#CBD8DC"/>
  <ellipse cx="370" cy="620" rx="70" ry="90" fill="#EAEFF0" transform="rotate(20 370 620)"/>
  <circle cx="40" cy="700" r="6" fill="#DCE5E8"/>

  <!-- logo mark -->
  <g transform="translate(150,140)">
    <path d="M8 0 H82 C86 0 90 4 90 8 V70 C90 82 78 90 66 90 H24 C12 90 0 82 0 70 V22 C0 8 8 0 8 0 Z"
          fill="#2F4858"/>
    <rect x="20" y="24" width="50" height="6" rx="3" fill="#F1F3F4" opacity="0.85"/>
    <rect x="20" y="40" width="35" height="6" rx="3" fill="#F1F3F4" opacity="0.6"/>
    <!-- match-score badge -->
    <circle cx="70" cy="66" r="18" fill="#DDE6E9"/>
    <circle cx="70" cy="66" r="18" fill="none" stroke="#5B8AA6" stroke-width="3" stroke-dasharray="80 33"/>
    <text x="70" y="70" text-anchor="middle" font-size="13" font-weight="500" fill="#2F4858">92</text>
  </g>

  <!-- wordmark -->
  <text x="195" y="270" text-anchor="middle" font-size="30" font-weight="500" fill="#1D2226">Tailor</text>

  <!-- signature flourish illustration motif -->
  <path d="M110 300 C 140 290, 160 320, 190 305 S 250 285, 280 300"
        fill="none" stroke="#5B8AA6" stroke-width="3" stroke-linecap="round"/>

  <!-- headline -->
  <text x="195" y="380" text-anchor="middle" font-size="24" font-weight="500" fill="#1D2226">Shape your resume</text>
  <text x="195" y="410" text-anchor="middle" font-size="24" font-weight="500" fill="#1D2226">to fit the job.</text>

  <!-- subtext -->
  <text x="195" y="445" text-anchor="middle" font-size="15" fill="#7B8681">Every application, tailored to what</text>
  <text x="195" y="465" text-anchor="middle" font-size="15" fill="#7B8681">they're actually asking for.</text>

  <!-- primary CTA - asymmetric radius -->
  <path d="M32 640 H326 C334 640 342 646 342 656 V678 C342 690 334 696 326 696 H48 C38 696 32 688 32 678 Z"
        fill="#2F4858"/>
  <text x="187" y="674" text-anchor="middle" font-size="16" font-weight="500" fill="#F1F3F4">Get started</text>

  <!-- secondary CTA -->
  <path d="M32 714 H326 C334 714 342 720 342 730 V752 C342 762 334 768 326 768 H48 C38 768 32 760 32 752 Z"
        fill="none" stroke="#A9B2B6" stroke-width="1.5"/>
  <text x="187" y="746" text-anchor="middle" font-size="16" fill="#1D2226">I already have an account</text>
</svg>
