<svg viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg">
  <rect width="390" height="844" fill="#F1F3F4"/>

  <text x="32" y="72" font-size="21" font-weight="500" fill="#1D2226">Writing your resume</text>
  <text x="32" y="98" font-size="13" fill="#7B8681">Almost there.</text>

  <!-- animated stacking-blocks motif, hero -->
  <g transform="translate(95,130)">
    <circle cx="100" cy="100" r="70" fill="#DDE6E9"/>
    <rect x="65" y="42" width="70" height="100" rx="6" fill="none" stroke="#A9B2B6" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>

    <g transform="translate(75,58)">
      <animateTransform attributeName="transform" type="translate" additive="sum"
        values="0,60; 0,0; 0,0; 0,60; 0,60"
        keyTimes="0; 0.1667; 0.8333; 0.9583; 1"
        dur="2.4s" repeatCount="indefinite"/>
      <rect x="0" y="0" width="55" height="10" rx="3" fill="#2F4858">
        <animate attributeName="opacity" values="0;1;1;0;0"
          keyTimes="0; 0.1667; 0.8333; 0.9583; 1" dur="2.4s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g transform="translate(75,78)">
      <animateTransform attributeName="transform" type="translate" additive="sum"
        values="0,60; 0,60; 0,0; 0,0; 0,60; 0,60; 0,60"
        keyTimes="0; 0.1667; 0.3333; 0.8333; 0.8333; 0.9583; 1"
        dur="2.4s" repeatCount="indefinite"/>
      <rect x="0" y="0" width="45" height="8" rx="3" fill="#5B8AA6">
        <animate attributeName="opacity" values="0;0;1;1;0;0;0"
          keyTimes="0; 0.1667; 0.3333; 0.8333; 0.8333; 0.9583; 1" dur="2.4s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g transform="translate(75,96)">
      <animateTransform attributeName="transform" type="translate" additive="sum"
        values="0,60; 0,60; 0,0; 0,0; 0,60; 0,60; 0,60"
        keyTimes="0; 0.3333; 0.5; 0.8333; 0.8333; 0.9583; 1"
        dur="2.4s" repeatCount="indefinite"/>
      <rect x="0" y="0" width="50" height="8" rx="3" fill="#5B8AA6">
        <animate attributeName="opacity" values="0;0;1;1;0;0;0"
          keyTimes="0; 0.3333; 0.5; 0.8333; 0.8333; 0.9583; 1" dur="2.4s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g transform="translate(75,114)">
      <animateTransform attributeName="transform" type="translate" additive="sum"
        values="0,60; 0,60; 0,0; 0,0; 0,60; 0,60; 0,60"
        keyTimes="0; 0.5; 0.6667; 0.8333; 0.8333; 0.9583; 1"
        dur="2.4s" repeatCount="indefinite"/>
      <rect x="0" y="0" width="38" height="8" rx="3" fill="#5B8AA6">
        <animate attributeName="opacity" values="0;0;1;1;0;0;0"
          keyTimes="0; 0.5; 0.6667; 0.8333; 0.8333; 0.9583; 1" dur="2.4s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <text x="32" y="392" font-size="13" fill="#1D2226">Reading the job description</text>
  <circle cx="342" cy="388" r="9" fill="#2F4858"/>
  <path d="M338 388 L341 391 L347 384" stroke="#F1F3F4" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <line x1="342" y1="398" x2="342" y2="418" stroke="#E4E9EB" stroke-width="2"/>
  <text x="32" y="440" font-size="13" fill="#1D2226">Finding your best-fit experience</text>
  <circle cx="342" cy="436" r="9" fill="#2F4858"/>
  <path d="M338 436 L341 439 L347 432" stroke="#F1F3F4" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <line x1="342" y1="446" x2="342" y2="466" stroke="#E4E9EB" stroke-width="2"/>
  <text x="32" y="488" font-size="13" font-weight="500" fill="#1D2226">Writing it in their language</text>
  <circle cx="342" cy="484" r="9" fill="#5B8AA6"/>

  <line x1="342" y1="494" x2="342" y2="514" stroke="#E4E9EB" stroke-width="2"/>
  <text x="32" y="536" font-size="13" fill="#7B8681">Formatting your resume</text>
  <circle cx="342" cy="532" r="9" fill="none" stroke="#A9B2B6" stroke-width="2"/>
</svg>
