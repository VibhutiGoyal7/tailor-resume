<svg width="720" height="240" viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg">
  <title>Tailor app icon and wordmark, light and dark lockups</title>
  <rect x="0" y="0" width="720" height="240" fill="#FFFFFF"/>

  <!-- Icon alone -->
  <g transform="translate(30,20) scale(1.0)">
    <path d="M8,26 C8,12 12,8 26,8 L70,8 C84,8 88,14 88,30 L88,70 C88,84 84,88 70,88 L26,88 C12,88 8,82 8,68 Z" fill="#2F4858"/>
    <rect x="27" y="22" width="34" height="46" rx="5" fill="#FFFFFF" transform="rotate(-6 44 45)"/>
    <g transform="rotate(-6 44 45)">
      <line x1="33" y1="32" x2="55" y2="32" stroke="#2F4858" stroke-width="3" stroke-linecap="round"/>
      <line x1="33" y1="40" x2="49" y2="40" stroke="#2F4858" stroke-width="3" stroke-linecap="round"/>
      <line x1="33" y1="48" x2="51" y2="48" stroke="#2F4858" stroke-width="3" stroke-linecap="round"/>
    </g>
    <path d="M58,58 C58,48 64,44 72,44 C80,44 84,50 84,58 C84,66 80,72 72,72 C64,72 58,68 58,58 Z" fill="#FFFFFF" transform="rotate(8 71 58)"/>
    <text x="71" y="62" font-size="13" font-weight="500" fill="#2F4858" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" transform="rotate(8 71 58)">91</text>
  </g>
  <text x="63" y="130" font-size="13" fill="#7B8681" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">App icon</text>

  <!-- Light wordmark lockup -->
  <rect x="180" y="30" width="230" height="80" rx="16" fill="#F1F3F4"/>
  <g transform="translate(195,40) scale(0.55)">
    <path d="M8,26 C8,12 12,8 26,8 L70,8 C84,8 88,14 88,30 L88,70 C88,84 84,88 70,88 L26,88 C12,88 8,82 8,68 Z" fill="#2F4858"/>
    <rect x="27" y="22" width="34" height="46" rx="5" fill="#FFFFFF" transform="rotate(-6 44 45)"/>
    <g transform="rotate(-6 44 45)">
      <line x1="33" y1="32" x2="55" y2="32" stroke="#2F4858" stroke-width="3" stroke-linecap="round"/>
      <line x1="33" y1="40" x2="49" y2="40" stroke="#2F4858" stroke-width="3" stroke-linecap="round"/>
      <line x1="33" y1="48" x2="51" y2="48" stroke="#2F4858" stroke-width="3" stroke-linecap="round"/>
    </g>
    <path d="M58,58 C58,48 64,44 72,44 C80,44 84,50 84,58 C84,66 80,72 72,72 C64,72 58,68 58,58 Z" fill="#FFFFFF" transform="rotate(8 71 58)"/>
    <text x="71" y="62" font-size="13" font-weight="500" fill="#2F4858" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" transform="rotate(8 71 58)">91</text>
  </g>
  <text x="270" y="80" font-size="26" font-weight="500" fill="#1D2226" font-family="Helvetica,Arial,sans-serif">tailor</text>

  <!-- Dark wordmark lockup -->
  <rect x="440" y="30" width="230" height="80" rx="16" fill="#1D2226"/>
  <g transform="translate(455,40) scale(0.55)">
    <path d="M8,26 C8,12 12,8 26,8 L70,8 C84,8 88,14 88,30 L88,70 C88,84 84,88 70,88 L26,88 C12,88 8,82 8,68 Z" fill="#5B8AA6"/>
    <rect x="27" y="22" width="34" height="46" rx="5" fill="#1D2226" transform="rotate(-6 44 45)"/>
    <g transform="rotate(-6 44 45)">
      <line x1="33" y1="32" x2="55" y2="32" stroke="#5B8AA6" stroke-width="3" stroke-linecap="round"/>
      <line x1="33" y1="40" x2="49" y2="40" stroke="#5B8AA6" stroke-width="3" stroke-linecap="round"/>
      <line x1="33" y1="48" x2="51" y2="48" stroke="#5B8AA6" stroke-width="3" stroke-linecap="round"/>
    </g>
    <path d="M58,58 C58,48 64,44 72,44 C80,44 84,50 84,58 C84,66 80,72 72,72 C64,72 58,68 58,58 Z" fill="#1D2226" transform="rotate(8 71 58)"/>
    <text x="71" y="62" font-size="13" font-weight="500" fill="#5B8AA6" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" transform="rotate(8 71 58)">91</text>
  </g>
  <text x="530" y="80" font-size="26" font-weight="500" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif">tailor</text>

  <text x="63" y="215" font-size="12" fill="#7B8681" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">#2F4858</text>
  <text x="295" y="215" font-size="12" fill="#7B8681" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">Light lockup</text>
  <text x="555" y="215" font-size="12" fill="#7B8681" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">Dark lockup</text>
</svg>